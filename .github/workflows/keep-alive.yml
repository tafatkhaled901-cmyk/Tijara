name: Surveillance Tijara

# Verifie toutes les heures que Tijara fonctionne reellement.
#
# Si un controle echoue, le workflow echoue — et GitHub envoie automatiquement
# un email au proprietaire du depot. C'est le mecanisme d'alerte : pas de
# service tiers, pas de secret a creer.
#
# Ce passage horaire maintient aussi le projet Supabase eveille. Les projets
# en offre gratuite se mettent en pause apres environ 7 jours sans activite,
# ce qui s'est produit entre juillet et octobre 2026 et a rendu Tijara
# inutilisable sans que personne s'en apercoive.
#
# A noter : ce ping MAINTIENT la base en vie, il ne REVEILLE PAS une base deja
# en pause. Si l'alerte se declenche pour ce motif, il faut restaurer le projet
# depuis supabase.com.

on:
  schedule:
    # Toutes les heures a :23. Minute decalee et non 0 : les taches planifiees
    # a l'heure pile sont souvent retardees par la charge de GitHub.
    - cron: '23 * * * *'
  # Permet de le lancer a la main depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Controler la base et le site
        run: |
          echec=0

          # 1) Base de donnees. La cle ci-dessous est la cle PUBLIABLE, deja
          #    presente en clair dans index.html qui est public : ce n'est pas
          #    un secret, la securite repose sur les politiques RLS.
          #    Cette requete valide d'un coup l'API REST, la base et les droits.
          base=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H 'apikey: sb_publishable_qBjAdqjgGM2peZCJwRJpCA_PdkdSUZp' \
            'https://ssttdkipuizsrteybnaw.supabase.co/rest/v1/stores?select=id&limit=1') || base=000
          echo "Base de donnees : HTTP $base"
          if [ "$base" != "200" ]; then
            echo "::error::BASE HORS SERVICE (HTTP $base). Le projet Supabase est probablement en pause : aucune commande ne peut etre passee et aucun vendeur ne peut se connecter. A restaurer depuis supabase.com."
            echec=1
          fi

          # 2) Site public servi par GitHub Pages
          site=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            'https://tafatkhaled901-cmyk.github.io/Tijara/') || site=000
          echo "Site : HTTP $site"
          if [ "$site" != "200" ]; then
            echo "::error::SITE HORS SERVICE (HTTP $site). Verifiez l'etat de GitHub Pages."
            echec=1
          fi

          # Les deux controles tournent ensemble pour qu'une seule execution
          # rapporte tout ce qui est casse, au lieu de s'arreter au premier.
          if [ "$echec" = "1" ]; then
            echo "Au moins un controle a echoue."
            exit 1
          fi
          echo "Tout fonctionne."
